<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Goblin-Master — Backend Engineer, Go, AI Agents">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E7E5E1" opacity="0.055"/>
    </pattern>
    <radialGradient id="glow" cx="0.14" cy="0.05" r="0.75">
      <stop offset="0%" stop-color="#E0A458" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#E0A458" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#E0A458" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.86" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#5EC8B8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5EC8B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0A458" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0A458" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7E5E1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E7E5E1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E7E5E1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="#0B0C0E"/>
  <rect width="1200" height="300" rx="14" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" fill="none" stroke="#E7E5E1" stroke-opacity="0.07"/>

  <!-- left accent bar -->
  <rect x="64" y="86" width="3" height="128" rx="1.5" fill="#E0A458"/>

  <text x="88" y="103" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="3.6" fill="#E0A458">BACKEND ENGINEER · GO · AI AGENTS</text>

  <text x="86" y="172" font-family="Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1.6" fill="#EDEAE5">GOBLIN-MASTER</text>

  <text x="88" y="212" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="17" fill="#8B8F96">从零写 agent，用 Go 把系统拼起来。</text>

  <rect x="88" y="238" width="360" height="1" fill="url(#rule)"/>

  <text x="88" y="266" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="1.2" fill="#6E747B">github.com/Goblin-Master</text>

  <!-- monogram -->
  <g transform="translate(1000 150)">
    <path d="M0,-110 L95.3,-55 L95.3,55 L0,110 L-95.3,55 L-95.3,-55 Z"
          fill="none" stroke="#E0A458" stroke-opacity="0.16" stroke-width="1"/>
    <path d="M0,-74 L64.1,-37 L64.1,37 L0,74 L-64.1,37 L-64.1,-37 Z"
          fill="#E0A458" fill-opacity="0.05" stroke="#E0A458" stroke-opacity="0.75" stroke-width="1.6"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace"
          font-size="46" font-weight="700" letter-spacing="1" fill="#E0A458">GM</text>
    <circle cx="0" cy="-74" r="3.2" fill="#5EC8B8"/>
    <circle cx="0" cy="74" r="3.2" fill="#E0A458" fill-opacity="0.55"/>
  </g>
</svg>

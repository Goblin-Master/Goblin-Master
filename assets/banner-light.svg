<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Goblin-Master — Backend Engineer, Go, AI Agents">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
